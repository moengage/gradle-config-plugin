name: Verify Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches: [ "development", "master" ]
      
env:
  publishKey: ${{ secrets.publishKey }}
  secretKey: ${{ secrets.secretKey }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signingInMemoryKey }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signingInMemoryKeyId }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signingInMemoryKeyPassword }}
        
jobs:
  assemble-verification:
    runs-on: macos-latest
    environment: publishing_gradle_config
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Set up gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: false
      - name: Build project
        run: ./gradlew assemble