name: Release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        type: string
        description: 'Enter the Release type [major / minor / patch]'
        required: true
      releaseTicket:
        type: string
        description: 'Enter the Release ticket number'
        required: true

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Configure git
        shell: bash
        run: |
          git config --global user.name "sdk-bot-user"
          git config --global user.email "sdk.bot@moengage.com"
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Set up gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: false
      - name: Release
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signingInMemoryKeyPassword }}
        run: |
          ./.github/scripts/release.main.kts ${{ secrets.publishKey }} ${{ secrets.secretKey }} ${{ github.event.inputs.releaseType }} ${{ github.event.inputs.releaseTicket }}